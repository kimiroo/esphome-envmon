name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'   # stable only: v1.0.0, v1.2.10 (no -rc, -beta, ...)

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      PACKAGE: envmon             # ← 저장소마다 이것만 변경
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install ESPHome
        run: pip install esphome==2026.9.1

      - name: Validate config
        run: esphome config "$PACKAGE.yaml"

      - name: Build bundle
        run: esphome bundle "$PACKAGE.yaml" -o "$PACKAGE-$TAG.esphomebundle.tar.gz"

      - name: Upload bundle to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE="$PACKAGE-$TAG.esphomebundle.tar.gz"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --generate-notes
          fi
